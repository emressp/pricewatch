# Alternative to Render. The checker runs in this same machine, so it must stay up.
# Create the volume once: fly volumes create pricewatch_data --size 1 --region iad
app = "pricewatch-monitor"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  TRUST_PROXY = "1"
  DATABASE_PATH = "/data/pricewatch.sqlite"
  OUTBOX_DIR = "/data/outbox"
  CHECKER_ENABLED = "1"
  ALLOW_LOCAL_FETCH = "0"
  DEMO_ENABLED = "0"
  ALLOW_PLAN_SWITCH = "0"
  POLAR_SERVER = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "pricewatch_data"
  destination = "/data"
